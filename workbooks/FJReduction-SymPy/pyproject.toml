[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fj-reduction-sympy"
version = "0.4.5"
description = "Exact compatible jump bases and t-module extension reduction with SymPy"
requires-python = ">=3.10"
dependencies = ["sympy>=1.14,<1.15"]

[project.optional-dependencies]
notebook = ["notebook>=7", "ipykernel>=6"]

[tool.setuptools.packages.find]
include = ["fj_sympy*"]
